apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-analyzer
  template:
    metadata:
      labels:
        app: log-analyzer
    spec:
      serviceAccountName: analyzer-sa   
      containers:
      - name: log-analyzer
        image: log-analyzer
        imagePullPolicy: Never
